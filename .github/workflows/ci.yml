name: ZELORA CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    name: Frontend Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-zelora/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend-zelora
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend-zelora
        run: npm run build

  backend-check:
    name: Backend System Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework django-cors-headers razorpay python-dotenv requests google-auth pillow

      - name: Run Django System Checks
        working-directory: backend/zelora
        env:
          SECRET_KEY: 'ci-testing-dummy-key-for-django-check'
          DEBUG: 'True'
        run: python manage.py check
