services:
  # 1. Redis In-Memory Cache & Session Broker
  redis:
    image: redis:7-alpine
    container_name: zelora_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. PostgreSQL Relational Database
  db:
    image: postgres:16-alpine
    container_name: zelora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zelora_db}
      POSTGRES_USER: ${POSTGRES_USER:-zelora_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zelora_luxury_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zelora_admin} -d ${POSTGRES_DB:-zelora_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Django REST Framework Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zelora_backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate && gunicorn zelora.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-zelora-production-secret-luxury-key-2026}
      - APP_NAME=ZELORA
      - USE_POSTGRES=true
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-zelora_db}
      - POSTGRES_USER=${POSTGRES_USER:-zelora_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-zelora_luxury_secret}
      - REDIS_URL=redis://redis:6379/1
      - USE_REDIS_SESSIONS=true
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. React 19 Frontend (Vite)
  frontend:
    build:
      context: ./frontend-zelora
      dockerfile: Dockerfile
    container_name: zelora_frontend
    restart: unless-stopped
    expose:
      - "5173"
    depends_on:
      - backend

  # 5. Nginx Dedicated Reverse Proxy & Gateway
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: zelora_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  media_data:
